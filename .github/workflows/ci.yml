name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff pyarrow requests beautifulsoup4 defusedxml pdfplumber python-docx sqlalchemy reportlab
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: README index and docs/ are up to date
        run: python make_index.py --check
